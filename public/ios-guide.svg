<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 340" role="img" aria-label="iPhone Safari bottom share button">
  <!-- фон -->
  <rect width="240" height="340" fill="#e0efff"/>
  <!-- корпус iPhone -->
  <rect x="55" y="12" width="130" height="280" rx="26" fill="#1c1c1e"/>
  <rect x="61" y="18" width="118" height="268" rx="21" fill="#ffffff"/>
  <!-- динамик -->
  <rect x="103" y="24" width="34" height="6" rx="3" fill="#1c1c1e"/>
  <!-- адресная строка -->
  <rect x="72" y="42" width="96" height="18" rx="9" fill="#eef1f4"/>
  <rect x="80" y="48" width="55" height="6" rx="3" fill="#c7ccd1"/>
  <!-- контент -->
  <rect x="72" y="72" width="96" height="10" rx="4" fill="#fde8dc"/>
  <rect x="72" y="90" width="80" height="8" rx="4" fill="#e9ecef"/>
  <rect x="72" y="104" width="88" height="8" rx="4" fill="#e9ecef"/>
  <rect x="72" y="118" width="60" height="8" rx="4" fill="#e9ecef"/>
  <rect x="72" y="138" width="96" height="52" rx="8" fill="#f4f6f8"/>
  <rect x="72" y="198" width="88" height="8" rx="4" fill="#e9ecef"/>
  <rect x="72" y="212" width="70" height="8" rx="4" fill="#e9ecef"/>
  <!-- нижняя панель Safari -->
  <rect x="61" y="240" width="118" height="46" rx="0" fill="#f7f8fa"/>
  <!-- кнопка Share (квадрат со стрелкой вверх) — в центре -->
  <rect x="101" y="248" width="26" height="26" rx="8" fill="#e8562a"/>
  <path d="M114 254 L114 266" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M108 259 L114 253 L120 259" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- пульсирующий круг вокруг Share -->
  <circle cx="114" cy="261" r="20" fill="none" stroke="#e8562a" stroke-width="3"/>
  <!-- стрелка-указатель -->
  <path d="M148 180 C 170 200, 170 230, 132 248" fill="none" stroke="#e8562a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6"/>
  <circle cx="132" cy="250" r="6" fill="#e8562a"/>
  <!-- подпись -->
  <text x="114" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#1c4e7c">Share</text>
  <text x="114" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#5a82a8">внизу по центру</text>
</svg>
